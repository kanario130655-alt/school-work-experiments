<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b3a">
  <title>Laundry Video Background Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #fff;
      background: #173b3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      padding: 32px;
      text-align: center;
    }

    .hero-video,
    .hero-shade {
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero-video {
      z-index: -2;
      object-fit: cover;
    }

    .hero-shade {
      background: linear-gradient(120deg, rgb(12 39 37 / 78%), rgb(12 39 37 / 24%));
    }

    .hero-content {
      width: min(720px, 100%);
      padding: 36px 24px;
    }

    .eyebrow {
      color: #d8edaa;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      line-height: 1.05;
    }

    .description {
      max-width: 540px;
      margin: 0 auto 24px;
      color: #eef5f0;
      font-size: 1.1rem;
    }

    .video-link {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid #fff;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
    }

    .video-link:hover,
    .video-link:focus-visible {
      background: #fff;
      color: #173b3a;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-video {
        display: none;
      }

      .hero {
        background: #173b3a;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <video class="hero-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
      <source src="laundry-background.mp4" type="video/mp4">
    </video>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="eyebrow">Nexus Laundry</p>
      <h1>Laundry, made lighter.</h1>
      <p class="description">A simple example of a looping video used as a full-screen website background.</p>
      <a class="video-link" href="laundry-background.mp4">Open the video with sound</a>
    </div>
  </main>
</body>
</html>
